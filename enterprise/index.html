<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZevFocus | All Sessions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
        min-height: 100vh;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
    }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

    <!-- Top Navigation -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="container flex justify-between items-center py-4">
            <h1 class="text-2xl font-bold text-blue-600 tracking-tight">ZevFocus</h1>
            <span class="text-sm text-gray-500">Productivity Tracking Dashboard</span>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container py-10">
        <!-- Title -->
        <h2 class="text-4xl font-extrabold text-center text-gray-900 mb-3">Session Overview</h2>
        <p class="text-center text-gray-600 mb-12">All recorded session data is displayed below. Enter a code to filter sessions.</p>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
            <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
                <div class="flex gap-2">
                    <input id="codeInput" type="text" placeholder="Enter code..." class="px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    <button id="refreshButton"
                        class="flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white font-medium rounded-full shadow hover:bg-blue-700 transition-colors duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 4v6h6M20 20v-6h-6M5 19a9 9 0 0114-14M19 5a9 9 0 01-14 14" />
                        </svg>
                        Fetch Sessions
                    </button>
                </div>
            </div>

            <!-- Table container -->
            <div id="session-table-container" class="overflow-x-auto rounded-lg border border-gray-200">
                <p class="text-center text-gray-500 py-6">Loading session data...</p>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const API_URL = 'https://test-api-inky-beta.vercel.app/api/session';
        const sessionTableContainer = document.getElementById('session-table-container');
        const refreshButton = document.getElementById('refreshButton');
        const codeInput = document.getElementById('codeInput');

        const fetchAndRenderSessions = async () => {
            const code = codeInput.value.trim();
            if (!code) {
                sessionTableContainer.innerHTML = '<p class="text-center text-gray-500 py-6">Please enter a code to fetch sessions.</p>';
                return;
            }

            sessionTableContainer.innerHTML = '<p class="text-center text-gray-500 py-6">Loading session data...</p>';
            try {
                const response = await fetch(`${API_URL}?code=${encodeURIComponent(code)}`);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const sessions = await response.json();
                renderSessions(sessions);
            } catch (error) {
                sessionTableContainer.innerHTML = `<p class="text-center text-red-500 py-6">⚠️ Error fetching data: ${error.message}</p>`;
            }
        };

        const renderSessions = (sessions) => {
            if (sessions.length === 0) {
                sessionTableContainer.innerHTML = '<p class="text-center text-gray-500 py-6">No sessions found for this code.</p>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'min-w-full border-collapse';

            table.innerHTML = `
<thead class="bg-gray-100 sticky top-0">
<tr>
${['Username','Task','Date','Start','End','Idle Sec','Active Sec','Tampered','Valid']
.map(h => `<th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">${h}</th>`).join('')}
</tr>
</thead>

<tbody class="divide-y divide-gray-200 bg-white">
${sessions.map((session, i) => `
<tr class="hover:bg-gray-50 cursor-pointer ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'}"
onclick="document.getElementById('log-${i}').classList.toggle('hidden')">
<td class="px-6 py-4 text-sm text-gray-900">${session.username}</td>
<td class="px-6 py-4 text-sm text-gray-700">${session.task}</td>
<td class="px-6 py-4 text-sm text-gray-700">${session.date}</td>
<td class="px-6 py-4 text-sm text-gray-700">${session.start}</td>
<td class="px-6 py-4 text-sm text-gray-700">${session.end}</td>
<td class="px-6 py-4 text-sm text-gray-700">${session.idle_sec}</td>
<td class="px-6 py-4 text-sm text-gray-700">${session.active_sec}</td>
<td class="px-6 py-4 text-sm font-bold">
<span class="${session.tampered ? 'text-red-600' : 'text-gray-400'}">
${session.tampered ? '🚨 Tampered' : '❌ No'}
</span>
</td>
<td class="px-6 py-4 text-sm font-bold">
<span class="${session.valid ? 'text-green-600' : 'text-red-600'}">
${session.valid ? '✅ Valid' : '❌ Invalid'}
</span>
</td>
</tr>
<tr id="log-${i}" class="hidden bg-gray-50">
<td colspan="9" class="px-6 py-4">
<table class="min-w-full border border-gray-200">
<thead class="bg-gray-100">
<tr>
${['Timestamp','Title','Idle Time','Status','Application']
.map(h => `<th class="px-4 py-2 text-left text-xs font-semibold text-gray-600">${h}</th>`).join('')}
</tr>
</thead>
<tbody>
${(session.log_json || []).length > 0 ? (session.log_json || []).map(log => `
<tr class="border-t border-gray-200">
<td class="px-4 py-2 text-sm text-gray-700">${log.timestamp}</td>
<td class="px-4 py-2 text-sm text-gray-700">${log.titleRaw}</td>
<td class="px-4 py-2 text-sm text-gray-700">${log.idleTime}</td>
<td class="px-4 py-2 text-sm text-gray-700">${log.status}</td>
<td class="px-4 py-2 text-sm text-gray-700">${log.Application}</td>
</tr>
`).join('') : `
<tr>
<td colspan="5" class="px-4 py-2 text-sm text-gray-500 text-center">No logs available</td>
</tr>
`}
</tbody>
</table>
</td>
</tr>
`).join('')}
</tbody>
`;

            sessionTableContainer.innerHTML = '';
            sessionTableContainer.appendChild(table);
        };

        refreshButton.addEventListener('click', fetchAndRenderSessions);
    });
    </script>

</body>
</html>
