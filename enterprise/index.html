
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZevFocus | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-6xl mx-auto flex justify-between items-center py-4 px-4">
      <h1 class="text-2xl font-bold text-blue-600 tracking-tight">ZevFocus</h1>
      <span class="text-sm text-gray-500">Productivity Tracking Dashboard</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-8">
    <!-- Controls -->
    <div class="flex gap-3">
      <input id="codeInput" type="text" placeholder="Enter teacher code..."
        class="px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1"/>
      <button id="fetchBtn"
        class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg shadow hover:bg-blue-700 transition">
        Fetch Sessions
      </button>
    </div>

    <!-- Class Summary -->
    <div id="summary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

    <!-- All Students Table -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h3 class="font-semibold mb-4">All Students Sessions</h3>
      <!-- ✅ scroll wrapper -->
      <div id="sessionTableWrapper" class="overflow-y-auto max-h-64">
        <div id="sessionTable" class="overflow-x-auto"></div>
      </div>
    </div>

    <!-- Selected Student Details -->
    <div id="studentDetails" class="hidden space-y-6">
      <h3 class="text-xl font-bold">Student Details</h3>
      <div id="studentSummary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl shadow">
          <h3 class="font-semibold mb-2">App Usage</h3>
          <canvas id="studentAppChart"></canvas>
        </div>
        <div class="bg-white p-6 rounded-xl shadow">
          <h3 class="font-semibold mb-2">Active vs Idle</h3>
          <canvas id="studentActiveIdleChart"></canvas>
        </div>
        <div class="bg-white p-6 rounded-xl shadow">
          <h3 class="font-semibold mb-2">Focus Trend</h3>
          <canvas id="studentFocusTrendChart"></canvas>
        </div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-semibold mb-4">Raw Logs</h3>
        <div id="studentLogs" class="overflow-x-auto"></div>
      </div>
    </div>
  </main>

  <script>
    const fetchBtn = document.getElementById("fetchBtn");
    const codeInput = document.getElementById("codeInput");
    const summary = document.getElementById("summary");
    const sessionTable = document.getElementById("sessionTable");
    const sessionTableWrapper = document.getElementById("sessionTableWrapper");
    const studentDetails = document.getElementById("studentDetails");
    const studentSummary = document.getElementById("studentSummary");
    const studentLogs = document.getElementById("studentLogs");

    let allSessions = [];
    let studentAppChart, studentActiveIdleChart, studentFocusTrendChart;

    function computeMetrics(sessions) {
      return sessions.map(s => {
        const totalTime = s.active_sec + s.idle_sec;
        const idlePercent = totalTime > 0 ? (s.idle_sec / totalTime) * 100 : 0;
        const focusScore = Math.max(0, 100 - idlePercent - (s.tampered ? 20 : 0));
        return { ...s, totalTime, idlePercent, focusScore };
      });
    }

    function renderClassSummary(sessions) {
      if (!sessions.length) {
        summary.innerHTML = "<p class='text-gray-500'>No data</p>";
        return;
      }
      const avgFocus = (sessions.reduce((a, b) => a + b.focusScore, 0) / sessions.length).toFixed(1);
      const totalStudy = (sessions.reduce((a, b) => a + b.totalTime, 0) / 60).toFixed(1);
      const avgIdle = (sessions.reduce((a, b) => a + b.idlePercent, 0) / sessions.length).toFixed(1);
      const topPerformer = sessions.sort((a, b) => b.focusScore - a.focusScore)[0].username;

      const cards = [
        { label: "Avg Focus Score", value: avgFocus },
        { label: "Total Study Time (min)", value: totalStudy },
        { label: "Avg Idle %", value: avgIdle + "%" },
        { label: "Top Performer", value: topPerformer }
      ];

      summary.innerHTML = cards.map(c => `
        <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center">
          <div class="text-2xl font-bold text-blue-600">${c.value}</div>
          <div class="text-gray-600">${c.label}</div>
        </div>
      `).join("");
    }

    function renderTable(sessions) {
      if (!sessions.length) {
        sessionTable.innerHTML = "<p class='text-gray-500'>No data</p>";
        return;
      }
      const table = `
        <table class="min-w-full border-collapse">
          <thead class="bg-gray-100">
            <tr>
              ${["Username","Task","Date","Study Time (min)","Idle %","Focus Score","Valid"].map(h =>
                `<th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">${h}</th>`
              ).join("")}
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            ${sessions.map((s, i) => `
              <tr class="cursor-pointer hover:bg-gray-50" onclick="showStudentDetails('${s.username}')">
                <td class="px-4 py-2 text-sm">${s.username}</td>
                <td class="px-4 py-2 text-sm">${s.task}</td>
                <td class="px-4 py-2 text-sm">${s.date}</td>
                <td class="px-4 py-2 text-sm">${(s.totalTime/60).toFixed(1)}</td>
                <td class="px-4 py-2 text-sm">${s.idlePercent.toFixed(1)}%</td>
                <td class="px-4 py-2 text-sm">${s.focusScore.toFixed(1)}</td>
                <td class="px-4 py-2 text-sm">${s.valid ? "✅" : "❌"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      sessionTable.innerHTML = table;
      sessionTableWrapper.scrollTop = 0; // reset scroll on reload
    }

    function showStudentDetails(username) {
      const studentSessions = allSessions.filter(s => s.username === username);
      if (!studentSessions.length) return;
      studentDetails.classList.remove("hidden");

      const avgFocus = (studentSessions.reduce((a, b) => a + b.focusScore, 0) / studentSessions.length).toFixed(1);
      const totalStudy = (studentSessions.reduce((a, b) => a + b.totalTime, 0) / 60).toFixed(1);
      const avgIdle = (studentSessions.reduce((a, b) => a + b.idlePercent, 0) / studentSessions.length).toFixed(1);

      studentSummary.innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center">
          <div class="text-2xl font-bold text-blue-600">${avgFocus}</div>
          <div class="text-gray-600">Avg Focus Score</div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center">
          <div class="text-2xl font-bold text-blue-600">${totalStudy}</div>
          <div class="text-gray-600">Total Study Time (min)</div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center">
          <div class="text-2xl font-bold text-blue-600">${avgIdle}%</div>
          <div class="text-gray-600">Avg Idle %</div>
        </div>
      `;

      // Charts
      const appCounts = {};
      studentSessions.forEach(s => (s.log_json || []).forEach(l => {
        appCounts[l.Application] = (appCounts[l.Application] || 0) + 1;
      }));

      const labels = studentSessions.map(s => s.date);
      const active = studentSessions.map(s => s.active_sec / 60);
      const idle = studentSessions.map(s => s.idle_sec / 60);
      const focusTrend = studentSessions.map(s => s.focusScore);

      if (studentAppChart) studentAppChart.destroy();
      if (studentActiveIdleChart) studentActiveIdleChart.destroy();
      if (studentFocusTrendChart) studentFocusTrendChart.destroy();

      studentAppChart = new Chart(document.getElementById("studentAppChart"), {
        type: "pie",
        data: { labels: Object.keys(appCounts), datasets: [{ data: Object.values(appCounts) }] }
      });

      studentActiveIdleChart = new Chart(document.getElementById("studentActiveIdleChart"), {
        type: "bar",
        data: { labels, datasets: [
          { label: "Active (min)", data: active, backgroundColor: "rgba(37,99,235,0.7)" },
          { label: "Idle (min)", data: idle, backgroundColor: "rgba(156,163,175,0.7)" }
        ]}
      });

      studentFocusTrendChart = new Chart(document.getElementById("studentFocusTrendChart"), {
        type: "line",
        data: { labels, datasets: [{ label: "Focus Score", data: focusTrend, borderColor: "rgba(16,185,129,1)" }] }
      });

      // Logs
      const logs = studentSessions.flatMap(s => s.log_json || []);
      if (!logs.length) {
        studentLogs.innerHTML = "<p class='text-gray-500'>No logs available</p>";
      } else {
        studentLogs.innerHTML = `
          <table class="min-w-full border-collapse">
            <thead class="bg-gray-100">
              <tr>
                ${["Timestamp","Title","Idle Time","Status","Application"].map(h =>
                  `<th class="px-4 py-2 text-left text-sm font-semibold text-gray-600">${h}</th>`
                ).join("")}
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
              ${logs.map(l => `
                <tr>
                  <td class="px-4 py-2 text-sm">${l.timestamp}</td>
                  <td class="px-4 py-2 text-sm">${l.titleRaw}</td>
                  <td class="px-4 py-2 text-sm">${l.idleTime}</td>
                  <td class="px-4 py-2 text-sm">${l.status}</td>
                  <td class="px-4 py-2 text-sm">${l.Application}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }
    }

    window.showStudentDetails = showStudentDetails;

    fetchBtn.addEventListener("click", async () => {
      const code = codeInput.value.trim();
      if (!code) { alert("Please enter a code!"); return; }
      sessionTable.innerHTML = "<p class='text-gray-500'>Loading...</p>";
      summary.innerHTML = "";
      studentDetails.classList.add("hidden");

      try {
        const res = await fetch(`https://zev-focus-api.vercel.app/api/session?code=${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error("API error: " + res.status);
        const raw = await res.json();
        allSessions = computeMetrics(raw);

        renderClassSummary(allSessions);
        renderTable(allSessions);
      } catch (err) {
        sessionTable.innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
