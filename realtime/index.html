<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZevFocus Dashboard</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .sidebar h2 { margin-top: 0; font-size: 20px; color: #333; }
        .sidebar input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .main { flex: 1; padding: 20px; overflow-y: auto; }
        h1 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #333; }
        .activity-card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .activity-card .user { font-weight: bold; font-size: 16px; margin-bottom: 5px; color: #444; }
        .log-entry { margin-left: 10px; font-size: 14px; padding: 5px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #eee; }
        .log-entry:last-child { border-bottom: none; }
        .timestamp { font-size: 12px; color: #555; margin-right: 10px; width: 160px; flex-shrink: 0; }
        .status-active { color: #28a745; font-weight: bold; }
        .status-idle { color: #dc3545; font-weight: bold; }
        .app-name { font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Search by User</h2>
        <input type="text" id="userSearch" placeholder="Enter user name">
    </div>
    <div class="main">
        <h1>ZevFocus Real-Time Activity</h1>
        <div id="activities"></div>
    </div>

    <script>
        const teacherKey = "9622d0e2-0575-4f67-8d08-214f05f5493b";
        const code = "cd245bebae";
        const activitiesContainer = document.getElementById('activities');
        const userSearch = document.getElementById('userSearch');
        let allData = [];

        async function fetchActivities() {
            try {
                const res = await fetch(`https://zev-focus-api.vercel.app/api/realtime?code=${code}&teacherKey=${teacherKey}`);
                if (!res.ok) throw new Error("Network response not ok");
                const data = await res.json();
                allData = data;
                renderActivities(userSearch.value.trim());
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        // Fetch every 3 seconds
        setInterval(fetchActivities, 3000);
        fetchActivities();

        userSearch.addEventListener('input', () => {
            renderActivities(userSearch.value.trim());
        });

        function renderActivities(filterUser = '') {
            activitiesContainer.innerHTML = '';

            let allLogs = [];
            allData.forEach(activity => {
                if (!activity.log_json) return;
                activity.log_json.forEach(log => {
                    allLogs.push({
                        ...log,
                        user_id: activity.user_id || "N/A"
                    });
                });
            });

            if (filterUser) {
                allLogs = allLogs.filter(log => log.user_id.toLowerCase() === filterUser.toLowerCase());
            }

            allLogs.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            const groupedLogs = {};
            allLogs.forEach(log => {
                if (!groupedLogs[log.user_id]) groupedLogs[log.user_id] = [];
                groupedLogs[log.user_id].push(log);
            });

            Object.keys(groupedLogs).forEach(user => {
                const card = document.createElement('div');
                card.className = 'activity-card';

                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.textContent = `User: ${user}`;
                card.appendChild(userDiv);

                groupedLogs[user].forEach(log => {
                    const logDiv = document.createElement('div');
                    logDiv.className = 'log-entry';
                    const statusClass = log.status.toLowerCase() === "active" ? 'status-active' : 'status-idle';
                    logDiv.innerHTML = `
                        <span class="timestamp">${log.timestamp}</span>
                        <span><span class="app-name">${log.Application}</span>: ${log.titleRaw}</span>
                        <span class="${statusClass}">Idle: ${log.idleTime}s, ${log.status}</span>
                    `;
                    card.appendChild(logDiv);
                });

                activitiesContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
